global
    maxconn 20000
    nbthread 1
    tune.bufsize 16384
    tune.maxrewrite 1024

defaults
    mode tcp
    no log
    option dontlognull
    retries 0
    timeout connect 50ms
    timeout client 2s
    timeout server 2s
    timeout queue 2s

frontend main
    bind *:9999 backlog 4096
    default_backend api

backend api
    balance roundrobin
    option httpchk
    http-check connect
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server maxconn 256 check inter 1s fall 3 rise 2
    server api1 unix@/data/shared/api1.sock
    server api2 unix@/data/shared/api2.sock
