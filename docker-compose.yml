services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - shared-data:/data/shared
    ports:
      - '9999:9999'
    depends_on:
      - api1
      - api2
      - data-loader
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: '60M'

  data-loader:
    image: jaoppb/rinha-2026-data-loader:latest
    volumes:
      - shared-data:/data/shared
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: '210M'

  api1: &api
    image: jaoppb/rinha-2026-rust:latest
    volumes:
      - shared-data:/data/shared
    environment:
      - SOCK=/data/shared/api1.sock
    deploy:
      resources:
        limits:
          cpus: '0.44'
          memory: '50M'

  api2:
    <<: *api
    environment:
      - SOCK=/data/shared/api2.sock

volumes:
  shared-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=210m"
