services:
  lb:
    build: ./lb
    volumes:
      - shared-data:/data/shared
    ports:
      - '9999:9999'
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: '30M'

  api1: &api
    image: jaoppb/rinha-2026-rust:latest
    volumes:
      - shared-data:/data/shared
    environment:
      - SOCK=/data/shared/api1.sock
    deploy:
      resources:
        limits:
          cpus: '0.39'
          memory: '40M'

  api2:
    <<: *api
    environment:
      - SOCK=/data/shared/api2.sock

volumes:
  shared-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m"
