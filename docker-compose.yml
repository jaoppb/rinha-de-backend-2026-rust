services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ipc: service:data-loader
    ports:
      - '9999:9999'
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: '40M'

  data-loader:
    build:
      context: .
      dockerfile: data/Dockerfile
    ipc: shareable
    shm_size: '184mb'
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: '200M'

  api1: &api
    build:
      context: .
      dockerfile: Dockerfile.dev
    ipc: service:data-loader
    environment:
      - SOCK=/dev/shm/api1.sock
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: '64M'

  api2:
    <<: *api
    environment:
      - SOCK=/dev/shm/api2.sock
