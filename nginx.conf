user root;
worker_processes auto;
worker_rlimit_nofile 10000;

events {
    worker_connections 5000;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    upstream api {
        server unix:/data/shared/api1.sock;
        server unix:/data/shared/api2.sock;
        keepalive 100;
    }

    server {
        listen 9999;
        
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
